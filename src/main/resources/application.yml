spring:
  application:
    name: accredit-service
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:accredit}
    username: ${DB_USERNAME:accredit}
    password: ${DB_PASSWORD:accredit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC   # UTC regardless of host timezone
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                  # wait for all in-sync replicas: no silent event loss
      properties:
        enable.idempotence: true # no duplicates on producer retries
        max.block.ms: 5000       # fail fast if Kafka is unreachable
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000 # max wait for Kafka's ack before the admin request fails
    consumer:
      auto-offset-reset: earliest  # new consumer group replays the whole topic
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: record             # commit each offset only after the event is applied to MySQL
      concurrency: 3               # one consumer thread per partition

accredit:
  kafka:
    topic:
      # {env}.{company}.{service}.{data}.{version}
      name: ${ENV:dev}.willow-wealth.${spring.application.name}.accreditation-events.v1
      partitions: 3
      replicas: 1                # single local broker; 3 in production
  expiry:
    max-age: 30d
    cron: ${EXPIRY_CRON:0 0 * * * *}   # hourly, at minute 0

server:
  port: 9999

management:
  endpoints:
    web:
      exposure:
        include: health,info
