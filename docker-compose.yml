name: accredit

services:
  mysql:
    image: mysql:8.4
    container_name: accredit-mysql
    environment:
      MYSQL_DATABASE: accredit
      MYSQL_USER: accredit
      MYSQL_PASSWORD: accredit
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./.data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-off: hand the bind-mounted data dir to the Kafka user (uid 1000).
  # Needed on Linux, where Docker creates missing bind-mount dirs as root.
  kafka-init:
    image: apache/kafka:4.3.2
    container_name: accredit-kafka-init
    user: root
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
    volumes:
      - ./.data/kafka:/var/lib/kafka/data

  kafka:
    image: apache/kafka:4.3.2
    container_name: accredit-kafka
    ports:
      - "9092:9092"
    volumes:
      - ./.data/kafka:/var/lib/kafka/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      # Single-node KRaft (broker + controller), no ZooKeeper.
      # Fixed cluster id so the persisted storage is reused across restarts.
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL: other containers (kafka:29092), EXTERNAL: host / the service (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker => replication factor 1 for internal topics
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are declared by the service, not created implicitly
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Optional UI to browse the audit events: docker compose --profile tools up -d
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: accredit-kafka-ui
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: accredit
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
